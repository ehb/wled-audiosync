name: release

# A tag vX.Y.Z runs the selftest, builds static binaries for aarch64 and armhf and attaches
# them to the GitHub Release of that tag.
# Tag this repository before alsa-leadtap: the alsa-leadtap release builds its LibreELEC
# add-on from the source of the wled-audiosync tag named in its ci/wled-audiosync.ref.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh ci/install_deps.sh
      - name: Native build and selftest
        run: make test CFLAGS="-O2 -g -Wall -Wextra -Werror" BUILD=build/native
      - name: Build and pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh ci/release_notes.sh "${TAG#v}" > /dev/null
          for arch in aarch64 armhf; do
            sh ci/build.sh "$arch"
            sh ci/package.sh "$arch" "${TAG#v}" dist
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh ci/release_notes.sh "${TAG#v}" > notes.md
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          gh release upload "$TAG" dist/*.tar.gz --clobber
